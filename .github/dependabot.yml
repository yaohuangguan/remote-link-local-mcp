version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime:
        patterns:
          - "@modelcontextprotocol/*"
          - "@wonderwhy-er/desktop-commander"
          - "zod"
      tooling:
        patterns:
          - "@types/*"
          - "tsx"
          - "typescript"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
